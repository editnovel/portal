[package]
name = "editnovel-wasm"
version = "0.1.0"
edition = "2024"

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
parallel = ["editnovel-engine/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
console_error_panic_hook = "0.1.7"
editnovel-engine = { git = "https://github.com/editnovel/engine", tag = "v0.1.1", version = "0.1.0" }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-rayon = { version = "1.3.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]
